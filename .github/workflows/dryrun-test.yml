name: Dry Run Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r threads-bot-repo/scripts/requirements.txt
      - run: python3 threads-bot-repo/scripts/publish.py --type surprise --dry-run
      - run: python3 threads-bot-repo/scripts/publish.py --type overtime --dry-run
      - run: python3 threads-bot-repo/scripts/publish.py --type latenight --dry-run
