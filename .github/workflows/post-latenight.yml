name: "Threads - latenight"
on: {schedule: [{cron: "30 15 * * 2,6"}], workflow_dispatch: {}}
jobs: {post: {runs-on: "ubuntu-latest", steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-python@v5", with: {python-version: "3.11"}}, {run: "pip install -r threads_bot/scripts/requirements.txt"}, {run: "python3 threads_bot/scripts/publish.py --type latenight", env: {THREADS_USER_ACCESS_TOKEN: "${{ secrets.THREADS_USER_ACCESS_TOKEN }}", THREADS_APP_SECRET: "${{ secrets.THREADS_APP_SECRET }}"}}]}}
