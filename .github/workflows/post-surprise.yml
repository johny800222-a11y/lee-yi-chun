name: "Threads - surprise"
on: {schedule: [{cron: "0 7 * * 1,3,5"}], workflow_dispatch: {}}
jobs: {post: {runs-on: "ubuntu-latest", steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-python@v5", with: {python-version: "3.11"}}, {run: "pip install -r threads_bot/scripts/requirements.txt"}, {run: "python3 threads_bot/scripts/publish.py --type surprise", env: {THREADS_USER_ACCESS_TOKEN: "${{ secrets.THREADS_USER_ACCESS_TOKEN }}", THREADS_APP_SECRET: "${{ secrets.THREADS_APP_SECRET }}"}}]}}
