name: Telegram Test
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "chat id used: $CHAT_ID"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" -d "chat_id=$CHAT_ID" -d "text=Test message from Claude. Please confirm this is the correct bot."
          echo ""
          echo "---"
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/getMe"
