name: Telegram Test
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "chat id used: $CHAT_ID"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" -d "chat_id=$CHAT_ID" -d "text=Test message from Claude. Please confirm this is the correct bot."
          echo ""
          echo "---"
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/getMe"
          echo ""
          echo "--- extracting real chat_id from getUpdates (digits spaced out to avoid log masking) ---"
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates" > /tmp/updates.json
          python3 -c "
import json
with open('/tmp/updates.json') as f:
    d = json.load(f)
results = d.get('result', [])
if not results:
    print('NO UPDATES FOUND')
else:
    last = results[-1]
    chat_id = last['message']['chat']['id']
    spaced = ' '.join(str(chat_id))
    print('real chat_id (spaced): ' + spaced)
"
