name: "Threads - growth"
on: {schedule: [{cron: "0 12 * * *"}], workflow_dispatch: {}}
jobs: {post: {runs-on: "ubuntu-latest", steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-python@v5", with: {python-version: "3.11"}}, {run: "pip install -r threads-bot-repo/scripts/requirements.txt"}, {run: "python3 threads-bot-repo/scripts/publish.py --type growth --no-image", env: {THREADS_USER_ACCESS_TOKEN: "${{ secrets.THREADS_USER_ACCESS_TOKEN }}", THREADS_APP_SECRET: "${{ secrets.THREADS_APP_SECRET }}"}}]}}
